[project]
name = "cyanml"
version = "0.1.0"
description = "A local LeetCode-style machine-learning exercise workbench."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.5",
    "numpy==2.1.3",
    "pydantic==2.10.2",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "torch==2.5.1",
    "uvicorn[standard]==0.32.1",
]

[dependency-groups]
dev = [
    "httpx==0.27.2",
    "pytest==8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
